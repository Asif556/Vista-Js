However, I realized that I made an incorrect assumption about some of the steps. Here is a more accurate and complete workflow.

```yml
name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache Node.js modules
        uses: actions/cache@v4
        id: cache
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          npm install
          npm install -g turbo

      - name: Lint and format
        run: |
          npm run lint
          npm run format

      - name: Build
        run: |
          npm run build

      - name: Test
        run: |
          npm run test

      - name: Security scanning and dependency checks
        run: |
          npm audit

      - name: Run ESLint
        run: |
          npm run eslint

      - name: Run TypeScript checks
        run: |
          npm run typescript

      - name: Notify on failure
        if: ${{ failure() }}
